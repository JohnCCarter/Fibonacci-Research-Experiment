# Konfiguration för Fibonacci-engine. Allt körningsbeteende styrs härifrån.
seed: 42

data:
  exchange: binance       # CCXT exchange-id
  symbol: BTC/USDT
  timeframe: 1h
  limit: 500              # antal candles att hämta

pivots:
  lookback: 3             # barer på varje sida för lokalt extrem
  atr_period: 14
  min_prominence_atr: 0.5 # minsta prominens (i ATR) för att räknas som pivot
  mode: fractal           # "window" (lokala extrema) eller "fractal" (strikt Williams)
  fractal_n: 1            # barer/sida i fraktal-läge (1 = snabbare/lokalare vändpunkter)

scoring:
  # Vikter för den förklarbara linjära poängsättningen av en swing-leg.
  weights:
    magnitude: 0.8           # legens storlek (ATR-normaliserad)
    recency: 0.6             # hur nära sista baren legen slutar
    prominence: 0.5          # endpunkternas prominens
    cleanliness: 0.9         # hur "rent" priset rörde sig längs legen
    round_number: 0.2        # endpunkter nära runda tal
    duration: -0.4           # straff för icke-ideal längd (se duration_target)
    structure_alignment: 1.4 # hur väl legen sitter i HH/HL- (resp LH/LL-) struktur
    scale_confluence: 1.2    # endpunkter signifikanta på flera fraktal-grader
  duration_target: 20     # idealt antal barer för en leg
  max_candidate_legs: 50  # tak på antal legs som utvärderas
  structure_window: 6     # antal färska pivots som väger in i marknadsstrukturen
  confluence_degrees: [5, 12]  # större fraktal-grader att kolla confluence mot
  confluence_tol_bars: 3       # hur nära en större-grads-pivot måste ligga
  confirm_min_retrace: 0.1     # pullback (andel av leg) för att swingen ska räknas bekräftad

fib:
  levels: [0.236, 0.382, 0.5, 0.618, 0.786]

evaluation:
  # Mjuka skalor för agreement-signalen (referens, inte pass/fail).
  price_tol_atr: 0.5      # prisfel-skala i ATR
  time_tol_bars: 3        # tidsfel-skala i barer
  fib_level_tol: 0.02     # fib-nivå-skala (andel av legens range)

sizing:
  # Lager B: positionsskalning (solros). Frikopplad från swing-urvalet.
  enabled: false
  entry_levels: [0.382, 0.5, 0.618]  # skala in i dessa retracement-nivåer
  sizes: [1.0, 2.0, 3.0]             # störst storlek i gyllene zonen (0.618)

backtest:
  # Kausalt walk-forward: mät hur stabilt urvalet är över tid (Lager A).
  warmup_bars: 60   # barer innan första urvalet
  step: 1           # stega cursorn så här många barer per steg
  extension_tol_bars: 5  # max Δend-bar för att räkna en ändring som förlängning (ej hopp)
