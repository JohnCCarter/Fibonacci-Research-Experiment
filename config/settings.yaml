# Konfiguration för Fibonacci-engine. Allt körningsbeteende styrs härifrån.
seed: 42

data:
  exchange: binance       # CCXT exchange-id
  symbol: BTC/USDT
  timeframe: 1h
  limit: 500              # antal candles att hämta

pivots:
  lookback: 5             # barer på varje sida för lokalt extrem
  atr_period: 14
  min_prominence_atr: 0.5 # minsta prominens (i ATR) för att räknas som pivot

scoring:
  # Vikter för den förklarbara linjära poängsättningen av en swing-leg.
  weights:
    magnitude: 1.0        # legens storlek (ATR-normaliserad)
    recency: 0.8          # hur nära sista baren legen slutar
    prominence: 0.6       # endpunkternas prominens
    cleanliness: 0.5      # hur "rent" priset rörde sig längs legen
    round_number: 0.2     # endpunkter nära runda tal
    duration: -0.3        # straff för icke-ideal längd (se duration_target)
  duration_target: 20     # idealt antal barer för en leg
  max_candidate_legs: 50  # tak på antal legs som utvärderas

fib:
  levels: [0.236, 0.382, 0.5, 0.618, 0.786]

evaluation:
  price_tol_atr: 0.5      # prisfel-tolerans i ATR
  time_tol_bars: 3        # tidsfel-tolerans i barer
  fib_level_tol: 0.02     # tolerans för fib-nivå (andel av legens range)
