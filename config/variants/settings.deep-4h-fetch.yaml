# settings.deep-4h-fetch.yaml
#
# FETCH-ONLY / PROVENANCE CONFIG — do not use for research analysis, experiment
# runners, backtest, review packs, or evaluation. Purpose: cache enough 4H bars
# to cover all human-fib annotations (earliest: BTC/USD 2017-11-29).
#
# Why a separate file?
#   settings.expansion.yaml intentionally limits 4h to 8000 bars (~3.6 years)
#   for reproducibility of the active research window. The 2017 BTC 4H fibs
#   require ~20 000 bars. Keeping that limit here isolates the deep-cache fetch
#   from the active protocol config.
#
# Usage (fetch only):
#   uv run python -m fibengine.data.fetch \
#     --symbols BTC/USD --timeframes 4h --refresh \
#     --config config/variants/settings.deep-4h-fetch.yaml
#
# After fetch, use settings.expansion.yaml for all research work — this file
# is only referenced when re-fetching the 4H cache.

seed: 42

data:
  exchange: bitfinex
  symbol: BTC/USD
  timeframe: 4h
  limit: 500
  # 2017-01-01 gives margin before the earliest 4H fib (2017-11-29).
  history_start: "2017-01-01"
  timeframe_limits:
    4h: 20000
    1d: 3500
    1w: 1000
    1M: 500

pivots:
  lookback: 3
  atr_period: 14
  min_prominence_atr: 0.5
  mode: fractal
  fractal_n: 1

scoring:
  weights:
    magnitude: 0.8
    recency: 0.6
    prominence: 0.5
    cleanliness: 0.9
    round_number: 0.2
    duration: -0.4
    structure_alignment: 1.4
    scale_confluence: 1.2
  duration_target: 20
  max_candidate_legs: 50
  structure_window: 6
  confluence_degrees: [5, 12]
  confluence_tol_bars: 3
  confirm_min_retrace: 0.1

fib:
  levels: [0.236, 0.382, 0.5, 0.618, 0.786]

evaluation:
  price_tol_atr: 0.5
  time_tol_bars: 3
  fib_level_tol: 0.02

sizing:
  enabled: false
  entry_levels: [0.382, 0.5, 0.618]
  sizes: [1.0, 2.0, 3.0]

labeling:
  enable_same_candle_mtf_resolution: true
  mtf_disambiguation: false

backtest:
  warmup_bars: 60
  step: 1
  extension_tol_bars: 5
  gate_max_flip_rate: 0.35
  gate_min_confirmed_rate: 0.5
  gate_min_direction_consistency: 0.8
  gate_max_endpoint_drift_bars: 40.0
