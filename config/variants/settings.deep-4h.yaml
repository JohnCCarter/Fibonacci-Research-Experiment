# settings.deep-4h.yaml
#
# Research config extending settings.expansion.yaml with deep 4H history.
# Use this (instead of settings.expansion.yaml) when running human_fib_events,
# review packs, or the review tool on 4H fibs that predate 2022-10-31.
#
# Requires: data/raw/bitfinex/BTC-USD/4h/limit_20000.csv
# Fetch:    uv run python -m fibengine.data.fetch \
#               --symbols BTC/USD --timeframes 4h --refresh \
#               --config config/variants/settings.deep-4h-fetch.yaml
#
# All other settings are identical to settings.expansion.yaml.

seed: 42

data:
  exchange: bitfinex
  symbol: BTC/USD
  timeframe: 1h
  limit: 500
  history_start: "2017-01-01"
  timeframe_limits:
    4h: 20000
    1d: 3500
    1w: 1000
    1M: 500

pivots:
  lookback: 3
  atr_period: 14
  min_prominence_atr: 0.5
  mode: fractal
  fractal_n: 1

scoring:
  weights:
    magnitude: 0.8
    recency: 0.6
    prominence: 0.5
    cleanliness: 0.9
    round_number: 0.2
    duration: -0.4
    structure_alignment: 1.4
    scale_confluence: 1.2
  duration_target: 20
  max_candidate_legs: 50
  structure_window: 6
  confluence_degrees: [5, 12]
  confluence_tol_bars: 3
  confirm_min_retrace: 0.1

fib:
  levels: [0.0, 0.382, 0.5, 0.618, 0.786, 1.0]
  scale_mode: log
  levels_profile: tradingview_log_chamoun

evaluation:
  price_tol_atr: 0.5
  time_tol_bars: 3
  fib_level_tol: 0.02

sizing:
  enabled: false
  entry_levels: [0.382, 0.5, 0.618]
  sizes: [1.0, 2.0, 3.0]

labeling:
  enable_same_candle_mtf_resolution: true
  mtf_disambiguation: false

backtest:
  warmup_bars: 60
  step: 1
  extension_tol_bars: 5
  gate_max_flip_rate: 0.35
  gate_min_confirmed_rate: 0.5
  gate_min_direction_consistency: 0.8
  gate_max_endpoint_drift_bars: 40.0
