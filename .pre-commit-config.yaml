# Install: uv sync --extra dev && uv run pre-commit install
# Run all:  uv run pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: repo-bounds
        name: repo bounds (anti-blob / module size)
        entry: uv run python scripts/check_repo_bounds.py
        language: system
        pass_filenames: true
      - id: wiki-lint
        name: wiki lint (dead links / orphan pages)
        entry: uv run python scripts/wiki_lint.py
        language: system
        pass_filenames: false
        files: ^docs/research_wiki/.*\.md$
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        # Run only when code/tests change; docs-only commits skip the full
        # suite (CI still runs full pytest on push — the authoritative gate).
        files: ^(src/|tests/).*\.py$
