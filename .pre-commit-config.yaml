# Install: uv sync --extra dev && uv run pre-commit install
# Run all:  uv run pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: repo-bounds
        name: repo bounds (anti-blob / module size)
        entry: uv run python scripts/check_repo_bounds.py
        language: system
        pass_filenames: true
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        # Run the suite only when code/deps/test-affecting config change. Docs-only
        # commits (docs/**, *.md) skip pytest — avoids a full-suite python.exe launch
        # (Symantec SONAR) for prose. CI still runs the full suite server-side, and
        # repo-bounds below still guards docs size on every commit.
        files: '\.py$|^pyproject\.toml$|^uv\.lock$|^config/.*\.ya?ml$'
