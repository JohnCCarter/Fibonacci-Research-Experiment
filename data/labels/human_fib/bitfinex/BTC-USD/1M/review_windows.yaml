# Source-fib review windows — BTC/USD 1M
#
# PURPOSE
# -------
# Fib levels are mathematical (derived from anchor_a/anchor_b prices).
# Review windows are human-defined scope: they say which time period is
# meaningful to review for a given fib.  Events outside the review window
# are excluded from all review artifacts (CSV, JSONL, REVIEW_INDEX.md, charts).
#
# RULE (human protocol)
# ---------------------
#   review_start_time = fib anchor_b.time   (omit to use that default)
#   review_end_time   = the point where the next macro segment takes over
#                       i.e. roughly when the next human 1M fib is drawn
#   Never extend review_end_time to "now" unless the fib is explicitly
#   the current active fib — use --full-history / full_history=True for debug.
#
# STATUS
# ------
# The three entries below are DRAFT — pending human confirmation (2026-06-10).
# The remaining 1M fibs are commented TBD; they render full-history until
# their windows are confirmed and added here.
#
# Schema per fib_id:
#   review_start_time: ISO-8601 UTC  (default: anchor_b.time if absent)
#   review_end_time:   ISO-8601 UTC  (default: end of candle cache if absent)

