[project]
name = "fibengine"
version = "0.1.0"
description = "Human-like Fibonacci swing-selection engine (research/prototype)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "ccxt>=4.0",
    "matplotlib>=3.8",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pandera>=0.20",
    "duckdb>=1.0",
    "mplfinance>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=4.0",
    "hypothesis>=6.0",
]
# Selection-learning ML lane (Issue #42). Kept OUT of default/dev install so the base stays light;
# gated fail-closed in research/selection_ranker_ml.py until enough human data + a locked holdout.
ml = [
    "scikit-learn>=1.4",
    "optuna>=3.6",
    "joblib>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fibengine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "archive", "experiments", "data"]
addopts = "--cov=fibengine --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
omit = ["*/labeling/tool.py"]
