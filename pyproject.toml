[project]
name = "fibengine"
version = "0.1.0"
description = "Human-like Fibonacci swing-selection engine (research/prototype)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "ccxt>=4.0",
    "matplotlib>=3.8",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fibengine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "archive", "experiments", "data"]
addopts = "--cov=fibengine --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
omit = ["*/labeling/tool.py"]
